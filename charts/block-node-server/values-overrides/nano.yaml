# This override values for the block-node-server chart to deploy a mini version of the block-node-server.
# This is useful for testing and development purposes with limited resources.
# ie: minikube

# Memory: the JVM itself stays small (see JAVA_OPTS below), but verifying TSS block proofs loads
# the TSS library's WRAPS verification parameters, about 200 MB off heap plus verifier working
# memory (measured peak 550 to 620 MB RSS under load with hedera-cryptography 3.18.0). The limit
# below accommodates that; a node that never receives TSS block proofs stays far below it.
resources:
  requests:
    cpu: "500m"
    memory: "512M"
  limits:
    cpu: "1"
    memory: "1Gi"

blockNode:
  config:
    JAVA_OPTS: '-Xmx24m -XX:MaxDirectMemorySize=8m -XX:MaxMetaspaceSize=32m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath="/tmp/dump.hprof"'
    SERVER_SOCKET_RECEIVE_BUFFER_SIZE_BYTES: "131072"
    MESSAGING_BLOCK_ITEM_QUEUE_SIZE: "128"
    MESSAGING_BLOCK_NOTIFICATION_QUEUE_SIZE: "16"
    BACKFILL_FETCH_BATCH_SIZE: "5"
    # The TSS library holds about 200 MB of WRAPS verification parameters off heap once loaded.
    # Loading is deferred to the first TSS block proof instead of happening at start, so a nano
    # node that never receives TSS block proofs does not pay for it.
    VERIFICATION_TSS_WARM_UP_ENABLED: "false"
  persistence:
    archive:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      existingClaim: "nano-archive-storage"
    live:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-live-pvc"
    logging:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-logging-pvc"
    applicationState:
      size: 100Mi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-application-state-pvc"
  health:
    readiness:
      initialDelaySeconds: 30
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 35
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

kubepromstack:
  enabled: false

loki:
  enabled: false

promtail:
  enabled: false
